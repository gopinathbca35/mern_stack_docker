services:
  backend:
    build: ./mern/backend
    ports:
      - "5050:5050"
    networks:
      - mern_network
    depends_on:
      - mongodb 
    restart: always     
  frontend:
    build: ./mern/frontend
    ports:
      - "5173:5173"
    networks:
      - mern_network
    environment:
    - VITE_API_URL=http://52.66.243.24:5050      
  mongodb:
    image: mongo:8.2
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - mern_network
    volumes:
      - mongo-data:/data/db
    restart: always  

networks:
  mern_network:
    driver: bridge      

volumes:
  mongo-data:
    driver: local
    
